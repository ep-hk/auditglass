name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/auditglass

      - name: Tests
        run: pytest -v

      - name: Adversarial suite
        # Called out separately so a failure here is obvious in the job list: these
        # are the tests that assert a control holds under attack.
        run: pytest tests/adversarial tests/ci -v

  no-egress:
    name: full run with no outbound network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run the whole pipeline with networking removed
        # Backs the claim in README and docs/threat-model.md T4 that a local-only
        # deployment makes no outbound request. `unshare -rn` gives the process a
        # network namespace with nothing but loopback, so any attempt to reach the
        # network fails rather than silently succeeding.
        run: |
          unshare -rn -- python -c "
          import socket, sys
          # Prove the sandbox is real before trusting the result of the run.
          try:
              socket.create_connection(('1.1.1.1', 443), timeout=3)
          except OSError:
              pass
          else:
              sys.exit('network was reachable; this job would not prove anything')
          "
          unshare -rn -- auditglass demo --output ./runs
          test -f ./runs/*/report.md
          test -f ./runs/*/manifest.json
          echo "completed with no outbound network"

  demo-integrity:
    name: demo still requires multiple rounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: One round must not find the cause
        # If the synthetic incident ever becomes solvable in a single query, the
        # premise of the project is visibly false to anyone running the demo.
        run: pytest tests/test_end_to_end.py::test_the_incident_needs_more_than_one_round -v

      - name: Fixture is reproducible from its generator
        run: |
          python demo/generate_fixture.py
          git diff --exit-code src/auditglass/_demo/ \
            || (echo "::error::the committed fixture does not match its generator" && exit 1)

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Installed package runs the demo
        # Catches packaging mistakes that an editable install hides, such as the
        # bundled demo assets not making it into the wheel.
        run: |
          pip install dist/*.whl
          cd "$(mktemp -d)"
          auditglass demo --output ./runs
          test -f ./runs/*/report.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
