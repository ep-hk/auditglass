name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/auditglass

      - name: Tests
        run: pytest -v

      - name: Adversarial suite
        # Called out separately so a failure here is obvious in the job list: these
        # are the tests that assert a control holds under attack.
        run: pytest tests/adversarial tests/ci -v

  no-egress:
    name: full run with no outbound network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run the whole pipeline with networking removed
        # Backs the claim in README and docs/threat-model.md T4 that a local-only
        # deployment makes no outbound request. `unshare -n` gives the process a
        # network namespace with nothing but loopback, so any attempt to reach the
        # network fails rather than silently succeeding.
        #
        # sudo, because Ubuntu 24.04 runners forbid unprivileged user namespaces
        # (AppArmor's apparmor_restrict_unprivileged_userns), so the rootless
        # `unshare -rn` form fails with "write failed /proc/self/uid_map". Paths are
        # absolute because sudo does not carry the runner's PATH.
        run: |
          PY="$(command -v python)"
          AG="$(command -v auditglass)"
          sudo unshare -n -- "$PY" -c "
          import socket, sys
          # Prove the sandbox is real before trusting the result of the run.
          try:
              socket.create_connection(('1.1.1.1', 443), timeout=3)
          except OSError:
              pass
          else:
              sys.exit('network was reachable; this job would not prove anything')
          print('sandbox confirmed: no route out')
          "
          sudo unshare -n -- "$AG" demo --output ./runs
          test -f ./runs/*/report.md
          test -f ./runs/*/manifest.json
          echo "completed with no outbound network"

  live-backends:
    name: connectors against real Loki and Prometheus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Start Loki, Prometheus and the seeder
        run: docker compose -f demo/docker-compose.yml up -d --wait

      - name: Connectors against live servers
        # This is the job that makes the README's claim about the Loki and Prometheus
        # connectors true. Nothing else in this workflow can: every other test runs
        # against fixtures or a stub, so a template that generates LogQL a real Loki
        # rejects would pass all of them. The test itself waits until the incident
        # has developed on both backends (pool saturated, error lines present), so
        # there is no blind sleep here.
        env:
          AUDITGLASS_LIVE: "1"
        run: pytest tests/integration -v

      - name: Backend logs on failure
        if: failure()
        run: docker compose -f demo/docker-compose.yml logs --tail=80

      - name: Tear down
        if: always()
        run: docker compose -f demo/docker-compose.yml down -v

  demo-integrity:
    name: demo still requires multiple rounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: One round must not find the cause
        # If the synthetic incident ever becomes solvable in a single query, the
        # premise of the project is visibly false to anyone running the demo.
        run: pytest tests/test_end_to_end.py::test_the_incident_needs_more_than_one_round -v

      - name: Fixture is reproducible from its generator
        run: |
          python demo/generate_fixture.py
          git diff --exit-code src/auditglass/_demo/ \
            || (echo "::error::the committed fixture does not match its generator" && exit 1)

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Installed package runs the demo
        # Catches packaging mistakes that an editable install hides, such as the
        # bundled demo assets not making it into the wheel.
        run: |
          pip install dist/*.whl
          cd "$(mktemp -d)"
          auditglass demo --output ./runs
          test -f ./runs/*/report.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
