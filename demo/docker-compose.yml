# Real Loki and real Prometheus, with a seeder that plays the synthetic incident
# into them live.
#
# This exists to answer the one question the offline demo cannot: does a real Loki
# accept the LogQL these templates generate, and does a real Prometheus accept the
# PromQL? Everything else about the connectors is covered by tests that need no
# backend.
#
#   docker compose -f demo/docker-compose.yml up -d --wait
#   AUDITGLASS_LIVE=1 pytest tests/integration -v
#   docker compose -f demo/docker-compose.yml down -v
#
# No manual wait is needed: the test blocks until the incident has fully developed
# on both backends, about two minutes after start-up, then runs one diagnosis.
#
# The seeder writes to Loki. auditglass cannot — that asymmetry is the point, and
# `tests/integration/test_live_backends.py` asserts it against these same servers.

name: auditglass-demo

services:
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -qx ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
      - --web.enable-lifecycle
    volumes:
      - ./seed/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/ready | grep -q Ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      seeder:
        condition: service_started

  seeder:
    image: python:3.12-slim
    working_dir: /seed
    volumes:
      - ./seed:/seed:ro
    command: ["python", "-u", "seed.py"]
    environment:
      LOKI_URL: http://loki:3100
      # Healthy for 75s, then the incident develops over 30s. The healthy period
      # must outlast one 60s query step or the diagnosis has no baseline to compare
      # against; see the docstring in seed/seed.py before shortening it.
      HEALTHY_SECONDS: "75"
      RAMP_SECONDS: "30"
      METRICS_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      loki:
        condition: service_healthy
